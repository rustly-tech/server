[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/domain",
    "crates/protocol",
    "crates/auth",
    "crates/storage",
    "crates/ranking",
    "crates/progress",
    "crates/community",
    "services/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV is declared and enforced by CI. It is set by our dependency floor:
# `time` 0.3.55 requires 1.88.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustly-tech/server"
authors = ["Rustly contributors"]

[workspace.dependencies]
rustly-common = { path = "crates/common", version = "0.1.0" }
rustly-domain = { path = "crates/domain", version = "0.1.0" }
rustly-protocol = { path = "crates/protocol", version = "0.1.0" }
rustly-auth = { path = "crates/auth", version = "0.1.0" }
rustly-storage = { path = "crates/storage", version = "0.1.0" }
rustly-upload-protocol = { version = "0.1.0", git = "https://github.com/rustly-tech/storage", rev = "2a66439e48c8571c7ac6016ce765e8888805c535", package = "rustly-upload-protocol" }
rustly-ranking = { path = "crates/ranking", version = "0.1.0" }
rustly-progress = { path = "crates/progress", version = "0.1.0" }
rustly-community = { path = "crates/community", version = "0.1.0" }

anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "json"] }
base64 = "0.23"
futures-core = "0.3"
futures-util = "0.3"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "time",
    "json",
    "macros",
    "migrate",
] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde-well-known", "macros", "parsing", "formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "request-id", "util", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
