name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: rustly-tech/.github/.github/workflows/rust-ci.yml@main
    with:
      msrv: "1.88.0"
      features: "--all-features"

  security:
    uses: rustly-tech/.github/.github/workflows/rust-security.yml@main
    with:
      # RUSTSEC-2023-0071 (Marvin attack in `rsa`) has no fixed release.
      # `rsa` reaches Cargo.lock only through sqlx's optional MySQL driver,
      # which this workspace never enables and never compiles - cargo-deny's
      # graph-aware advisories check passes for exactly that reason. cargo-audit
      # reads the lockfile, so it needs to be told. Revisit when sqlx drops the
      # dependency or `rsa` ships a fix. Tracked in rustly-tech/server#10.
      audit-ignore: "RUSTSEC-2023-0071"

  postgres:
    name: postgres conformance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: rustly
          POSTGRES_DB: rustly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The PostgreSQL backend must satisfy exactly the same conformance suite
      # as the in-memory backend. That equivalence is what makes it legitimate
      # for the API integration tests to run in memory.
      RUSTLY_TEST_DATABASE_URL: postgres://postgres:rustly@localhost:5432/rustly_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: postgres
      - name: Run the conformance suite against PostgreSQL
        run: |
          cargo test -p rustly-storage --features postgres,testing \
            --test postgres_conformance -- --nocapture

  docker:
    name: container image
    runs-on: ubuntu-latest
    needs: [rust]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build the image
        run: docker build -t rustly-api:${{ github.sha }} --build-arg BUILD=${{ github.sha }} .

      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name api -p 8080:8080 \
            -e RUSTLY_TOKEN_SECRET=ci-only-secret-value-at-least-32-bytes \
            rustly-api:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/version | tee /dev/stderr | grep -q '"api_version":1'
          curl -fsS http://localhost:8080/ready | grep -q '"healthy":true'
          docker rm -f api

      # Published images are durable artifacts and belong in a registry, not in
      # Actions artifact storage. Only pushes to main and tags publish.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository }}/api
          docker tag rustly-api:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag rustly-api:${{ github.sha }} "$IMAGE:main"
            docker push "$IMAGE:main"
          fi
          case "${{ github.ref }}" in
            refs/tags/v*)
              docker tag rustly-api:${{ github.sha }} "$IMAGE:${GITHUB_REF_NAME}"
              docker push "$IMAGE:${GITHUB_REF_NAME}"
              ;;
          esac

      - name: Generate an SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: rustly-api:${{ github.sha }}
          artifact-name: rustly-api-sbom.spdx.json

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: rustly
          POSTGRES_DB: rustly_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Apply every migration with ON_ERROR_STOP
        env:
          PGPASSWORD: rustly
        run: |
          set -euo pipefail
          for file in migrations/*.sql; do
            echo "applying $file"
            psql -h localhost -U postgres -d rustly_migrate -v ON_ERROR_STOP=1 -f "$file"
          done
          psql -h localhost -U postgres -d rustly_migrate -c '\dt'
